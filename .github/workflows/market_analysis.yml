# ─────────────────────────────────────────────────────────────
# SmartEntry Market Analysis — GitHub Actions Workflow
#
# Replaces the Oracle VM + n8n cron approach.
# Runs every 15 minutes during UK market hours (8AM–10PM),
# weekdays only. Automatically adjusts for BST/GMT (DST).
#
# Cost estimate: ~60 runs/day × 1 min × 5 days = ~300 min/month
# ─────────────────────────────────────────────────────────────

name: Market Analysis

on:
  schedule:
    # Cron uses UTC. We use 7-22 to cover BOTH:
    #   BST (summer): 8AM UK = 07 UTC, 10PM UK = 21 UTC
    #   GMT (winter): 8AM UK = 08 UTC, 10PM UK = 22 UTC
    # The time_check step below filters the exact UK hours.
    - cron: '*/15 7-22 * * 1-5'

  # Allow manual trigger from GitHub UI (useful for testing)
  workflow_dispatch:

jobs:
  analyze:
    name: Run Analysis Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

    steps:
      # ── DST-aware time check ────────────────────────────
      # Uses Europe/London timezone so it automatically
      # switches between BST (UTC+1) and GMT (UTC+0).
      # Skips the run if outside 8AM–10PM UK time.
      # On manual trigger (workflow_dispatch), always runs.
      - name: 🕐 Check UK market hours
        id: time_check
        run: |
          UK_HOUR=$(TZ=Europe/London date +%-H)
          UK_TIME=$(TZ=Europe/London date +%H:%M)
          echo "🇬🇧 Current UK time: $UK_TIME (hour: $UK_HOUR)"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual trigger — skipping time check"
            echo "should_run=true" >> $GITHUB_OUTPUT
          elif [ "$UK_HOUR" -ge 8 ] && [ "$UK_HOUR" -lt 22 ]; then
            echo "✅ Within market hours (8AM–10PM UK)"
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "⏭️ Outside market hours — skipping"
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - name: 📥 Checkout repository
        if: steps.time_check.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        if: steps.time_check.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: analysis/requirements.txt

      - name: 📦 Install dependencies
        if: steps.time_check.outputs.should_run == 'true'
        run: pip install -r analysis/requirements.txt

      - name: 🚀 Run analysis pipeline
        if: steps.time_check.outputs.should_run == 'true'
        run: python analysis/run_analysis.py
