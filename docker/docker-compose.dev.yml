version: '3.8'

# Development overrides — mount source code for hot reload
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
      target: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api
    ports:
      - "3000:3000"
    command: npm run dev

  backend:
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "4000:4000"
    command: npm run dev

  analysis:
    volumes:
      - ./analysis:/app
    ports:
      - "5000:5000"
    command: python app.py

  redis:
    ports:
      - "6379:6379"
